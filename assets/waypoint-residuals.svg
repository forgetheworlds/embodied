<text x="66" y="374" font-size="11" fill="#7f1d1d">Same probe with the failed configuration (accept-mission-12, run-a): 255.0 cm and 241.5 cm — off this scale; the aircraft crashed and disarmed before the holds.</text>
<text x="66" y="410" font-size="12" fill="#374151">Bars are cm; every value is the tracking_residual_m field of the named run’s motion.jsonl.</text>
