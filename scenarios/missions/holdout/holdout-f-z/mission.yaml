layout: holdout-f-z
mission_type: search_inspect_return
instruction_family: heldout_multi_clause
instructions:
- Inspect the red bottle behind the two corridor turns, then return to the start.
search_region: far_room
spawn_pose:
  x: 2.0
  y: 1.0
  z: 0.09
  yaw_rad: 0.0
  note: identical to the Iris translation in world.wbt (plan section 6 pin 8)
expected_devices:
- camera left
- camera right
- accelerometer
- gyro
- inertial unit
- gps
- m1_motor
- m2_motor
- m3_motor
- m4_motor
budgets:
  hover_altitude_m: 1.5
  hold_per_waypoint_s: 8
  settle_s: 1.5
  at_rest_window_s: 2.0
  pre_arm_wait_s: 60
  step_timeout_s:
    startup: 90
    ready: 60
    flight: 120
  budget_wall_clock_s: 600
budgets_source: configs/first_indoor.yaml probe (no new values)
variants:
- name: blocked_route_spatial_event
  trigger: spatial_event
  world_contains: false
  note: the barrier node across the Z corridor is added by the variant build; the default world is route-open
    (plan section 3 axis 4)
vehicle:
  base:
  - scenarios/compat/params/compat_base.parm
  - scenarios/compat/params/compat_arming.parm
  estimator:
  - scenarios/compat/params/compat_ekf.parm
  calibration: scenarios/compat/calibration.json
  controller: scenarios/compat/controllers/compat_vehicle_controller
