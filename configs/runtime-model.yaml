# P04 runtime model and pilot parameters.
#
# Two of the three sections record decisions; the third declares the pilot's
# engineering parameters. Every number here is a declared assumption pending
# development-data selection (SYSTEM-SPECIFICATION 9.1:252, 16.3:492) — the
# same standing as configs/first_indoor.yaml's declared envelopes. Nothing in
# this file is a measurement.

model:
  # Owner ruling 2026-10-01: the runtime route is PINNED to Command Code's
  # DeepSeek V4.1 Flash and the paid-call ceiling is raised to US$10 (the
  # original grant was US$5, LIVE-RULINGS R7). Catalog evidence:
  # ~/.atomic/agent/models.json — provider `commandcode`,
  # baseUrl https://api.commandcode.ai/provider/v1, api openai-completions,
  # auth $COMMAND_CODE_API_KEY, model `deepseek/deepseek-v4.1-flash`
  # (reasoning, context 1M, maxTokens 16384). The ten dollars is a ceiling,
  # not a target: every call is retained with its reason and actual spend.
  provider: commandcode
  id: deepseek/deepseek-v4.1-flash
  identity_verbatim: commandcode/deepseek/deepseek-v4.1-flash
  source:
    - Atomic catalog ~/.atomic/agent/models.json (commandcode provider entry, verified 2026-10-01)
    - owner ruling 2026-10-01 ("budget of 10 bucks on command code deepseek v4.1")
    - design/docs/APPROVAL-RECORD.md:35,46,849 (this route was already the project-measured image route: 232+ prompt tokens, correct answers, p50 1.93s over 20 samples with the small fixture image)
  declared_input: [text, image]   # declared by the catalog; live image+tool support is the probe's job
  api: openai-completions
  base_url: https://api.commandcode.ai/provider/v1
  image_transport: base64         # APPROVAL-RECORD.md:46 — URL fetch fails server-side; base64 measured working
  # The owner's ruling of 2026-10-01 splits the two classes of cloud call: the
  # initial mission interpretation reasons, but the tactical updates that
  # arrive while the aircraft is moving must fit the decision budget or the
  # continuous-cloud arm cannot exist. `image_scale` is the one reserved key in
  # a profile; every other key is a generation parameter passed straight into
  # the request. Callers that predate the split are unchanged: an undeclared
  # class gets the base `generation` and the captured frame.
  #
  # Measured on this route 2026-10-01 (J4, ten frames of a real captured
  # stereo pair, decision quality scored beside every number):
  #   captured resolution, reasoning on    p50 11.64 s   quality 11/11
  #   captured resolution, reasoning off   p50  5.35 s   quality 10/10
  #   quarter scale,       reasoning off   p50  2.67 s   quality 10/10
  # `reasoning_effort: low` measured NO reduction (16.27 s with 1,544
  # reasoning tokens), so no profile uses it. The residual floor is transport
  # plus text prefill, not the model. The declared `latency_budget_s` below is
  # NOT changed by any of this; the floor and the measurement are reported in
  # work/runs/p05/J6-cloud-effort-REPORT.md.
  call_profiles:
    initial:
      image_scale: 1.0
      reasoning_effort: high
    continuous:
      image_scale: 0.25
      reasoning_effort: "off"

  # NOTE: quote it. YAML 1.1 reads an unquoted `off` as the boolean false, so
  # `reasoning_effort: off` would put `false` in the request body instead of
  # the string the API accepts, and nothing downstream would complain.
  # `provider.parse_call_profiles` now refuses a non-string reasoning_effort
  # for exactly this reason.
  alternates:
    - id: opencode-go/deepseek-v4.1-flash
      source: the previously declared route (2026-09-26); superseded by the owner's 2026-10-01 pin of commandcode, kept for provenance
    - id: opencode-go/mimo-v2.6-flash
      source: catalog entry, input [text, image], $0.14/$0.28 per M tokens (declared, unverified)
  never: deepseek-v4-pro or any pro-tier escalation (APPROVAL-RECORD.md:35; AGENTS.md)

# Live-call budget, recorded by the owner's 2026-10-01 ruling: pilot-probe (and
# the sampler) refuse a live call unless an explicit --max-calls is also passed
# AND limits are recorded here. The ceiling is the whole stage's paid-call
# budget; actual spend is reported against it in every receipt.
probe:
  # Raised 30 -> 60 for the J4 configuration matrix (owner: cost is not the
  # constraint; latency and decision quality are). The ceiling stays the
  # runaway guard it always was; measured spend is reported per receipt.
  max_calls: 60
  spend_ceiling_usd: 10

# Declared pilot parameters. Each is an engineering assumption chosen for
# development, not a measured frequency or latency; workload tests must
# validate them before any of these numbers is treated as fact.
pilot:
  # Scene-signature delta below which a repeated change triggers no new
  # event (§9.1 deadband).
  event_deadband: 0.08
  # A static-looking but relevant scene is still reviewed at least this often.
  max_silence_s: 6.0
  # Anticipatory rule (§9.3): send when time-to-decision-boundary approaches
  # the latency budget plus this guard. The budget is the measured p50 latency
  # (1.93s) rounded up with headroom; it is not an integrated critical-path
  # measurement (§16.1:475 — none exists yet).
  latency_budget_s: 2.5
  guard_margin_s: 1.0
  # A cloud request older than this is expired; its remaining delay is never
  # set to zero (§17.3:516).
  response_deadline_s: 4.0
  # Observation freshness bound: an observation older than this, at the moment
  # a decision or a grounding uses it, is stale. It is never cited as current
  # evidence and never grounds a fresh spatial goal; its measured age is
  # recorded with the decision (truth-pose masking critique). Declared as
  # 2x the latency budget plus margin; development data selects the final value.
  observation_freshness_s: 6.0
  # Provider retries count against the call and deadline budget (§15.3:453).
  retry_budget: 1
