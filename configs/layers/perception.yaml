# Perception-layer live sim verification (not pytest).
#
# Canonical entry: ./configs/layers/perception
# Exercises stacked EstimationPort + MappingPort: stereo+IMU → depth → MapStore
# → OccupancyQuery with evidence_class=sensor_derived FREE.
#
# AP may use simulator-interface truth VPE for airworthiness; that path is
# orthogonal and must not appear as Perception capture pose.

project:
  stage: P00-perception
  name: layer-perception

platform:
  ardupilot_root: work/ardupilot
  ardupilot_commit: af8525911b49a4c2a3bdc83bc5ed57e1d0098134
  sitl_binary: work/ardupilot/build/sitl/bin/arducopter
  webots_home: work/Webots.app
  webots_version: R2025a
  webots_mode: realtime
  sim_wall_clamp: true
  sim_model: webots-python
  vehicle: ArduCopter
  sitl_home: "-35.363261,149.165230,584,353"
  endpoints:
    sitl: "tcp:127.0.0.1:5760"
    fdm_port: 9002
    controller_port: 9010

scenario:
  world: scenarios/first_indoor/world.wbt
  params:
    - scenarios/compat/params/compat_base.parm
    - scenarios/compat/params/compat_arming.parm
  estimator_params:
    - scenarios/compat/params/compat_ekf.parm

sensors:
  stereo:
    left: "camera left"
    right: "camera right"
    width: 640
    height: 480
    baseline_m: 0.10
    sampling_period_ms: 100
    encoding: rgb8
    identical_channel_fraction_limit: 0.99
  imu:
    accelerometer: accelerometer
    gyro: gyro
    inertial_unit: "inertial unit"
    gps: gps
    sampling_period_ms: 2
  calibration: scenarios/compat/calibration.json

probe:
  hover_altitude_m: 1.5
  waypoints_local_ned:
    - [-0.40, 0.00, 0.0]
  hold_per_waypoint_s: 4
  stream_loss_window_s: 6
  settle_s: 1.5
  at_rest_window_s: 2.0
  pre_arm_wait_s: 120
  estimator_fault:
    kind: position_step
    magnitude_m: 30.0
    hold_s: 6
  timebase_samples: 40
  realtime_window_s: 5.0
  realtime_ratio_envelope: [0.5, 1.5]
  timebase_poll_s: 0.005
  step_timeout_s:
    startup: 90
    ready: 60
    flight: 240
  budget_wall_clock_s: 1200

motion:
  hover_altitude_m: 1.5
  hold_per_waypoint_s: 4
  residual_max_m: 0.10
  waypoints_local_ned:
    - [-0.40, 0.00, 0.0]

output: work/runs/layers/perception
